name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Check CI and release regressions
        run: |
          bash scripts/test-release-workflows.sh
          bash scripts/test-check-apk-size.sh

      - name: Run tests, lint, and debug build
        run: |
          ./gradlew \
            verifyBuildscriptBouncyCastle \
            test \
            lint \
            assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Build optimized arm64 alpha
        run: |
          ./gradlew \
            :app:assembleAlpha \
            -Pthwiply.abi=arm64-v8a \
            -Pthwiply.versionCode=1 \
            -Pthwiply.versionName=ci-alpha \
            --stacktrace \
            --no-daemon

      - name: Enforce arm64 alpha size budget
        run: |
          bash scripts/check-apk-size.sh \
            app/build/outputs/apk/alpha/app-alpha-unsigned.apk \
            33554432

  instrumentation:
    name: Android instrumentation
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-disabled: true

      - name: Provision emulator and system image
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/instrumentation"
          {
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends libpulse0
            sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            "$sdkmanager" --licenses <<< "$(printf 'y\n%.0s' {1..100})"
            "$sdkmanager" --install "emulator" "platform-tools" \
              "system-images;android-36;google_apis;x86_64"
            "$sdkmanager" --list_installed
          } 2>&1 | tee "$RUNNER_TEMP/instrumentation/sdk-setup.log"

      - name: Verify SDK and hardware acceleration
        timeout-minutes: 2
        run: |
          set -euo pipefail
          {
            if [[ ! -c /dev/kvm ]]; then
              echo "Required KVM device /dev/kvm is missing" >&2
              exit 1
            fi
            sudo chmod a+rw /dev/kvm
            java -version
            "$ANDROID_HOME/emulator/emulator" -version
            "$ANDROID_HOME/emulator/emulator" -accel-check
            "$ANDROID_HOME/platform-tools/adb" version
          } 2>&1 | tee "$RUNNER_TEMP/instrumentation/toolchain.log"

      - name: Run full managed-device suite
        timeout-minutes: 30
        run: |
          set -euo pipefail
          ./gradlew clean :app:pixel2api36DebugAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.experimental.testOptions.managedDevices.setupTimeoutMinutes=5 \
            -Pandroid.experimental.testOptions.managedDevices.maxConcurrentDevices=1 \
            --rerun-tasks --no-build-cache \
            --stacktrace --info --no-daemon \
            2>&1 | tee "$RUNNER_TEMP/instrumentation/gradle.log"

      - name: Verify instrumentation actually executed
        run: |
          set -euo pipefail
          python3 scripts/check-instrumentation-results.py \
            app/build/outputs/androidTest-results/managedDevice/debug/pixel2api36 \
            2>&1 | tee "$RUNNER_TEMP/instrumentation/test-counts.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain instrumentation reports and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: instrumentation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/instrumentation/
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/**/TEST-*.xml
            app/build/outputs/androidTest-results/managedDevice/**/logcat-*.txt
            app/build/outputs/androidTest-results/managedDevice/**/testlog/*.log
            app/build/outputs/androidTest-results/managedDevice/**/test-result*
