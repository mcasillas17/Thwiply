name: Release optimized alpha APKs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, sign, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAX_ARM64_APK_BYTES: "33554432"

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Validate alpha tag and main ancestry
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "Unsupported alpha tag: $TAG_NAME" >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit must be contained in origin/main: $GITHUB_SHA" >&2
            exit 1
          fi

          version_name="${TAG_NAME#v}"
          version_code="$(git rev-list --count HEAD)"
          if [[ ! "$version_code" =~ ^[1-9][0-9]*$ ]]; then
            echo "Unable to derive a positive Android version code: $version_code" >&2
            exit 1
          fi

          printf 'VERSION_NAME=%s\n' "$version_name" >> "$GITHUB_ENV"
          printf 'VERSION_CODE=%s\n' "$version_code" >> "$GITHUB_ENV"

      - name: Validate signing secrets
        env:
          ALPHA_KEYSTORE_BASE64: ${{ secrets.ALPHA_KEYSTORE_BASE64 }}
          ALPHA_KEYSTORE_PASSWORD: ${{ secrets.ALPHA_KEYSTORE_PASSWORD }}
          ALPHA_KEY_ALIAS: ${{ secrets.ALPHA_KEY_ALIAS }}
          ALPHA_KEY_PASSWORD: ${{ secrets.ALPHA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          [[ -n "$ALPHA_KEYSTORE_BASE64" ]] || {
            echo "Missing ALPHA_KEYSTORE_BASE64" >&2
            exit 1
          }
          [[ -n "$ALPHA_KEYSTORE_PASSWORD" ]] || {
            echo "Missing ALPHA_KEYSTORE_PASSWORD" >&2
            exit 1
          }
          [[ -n "$ALPHA_KEY_ALIAS" ]] || {
            echo "Missing ALPHA_KEY_ALIAS" >&2
            exit 1
          }
          [[ -n "$ALPHA_KEY_PASSWORD" ]] || {
            echo "Missing ALPHA_KEY_PASSWORD" >&2
            exit 1
          }

      - name: Test, lint, and build arm64 alpha
        run: |
          set -euo pipefail

          ./gradlew \
            verifyBuildscriptBouncyCastle \
            test \
            lint \
            :app:assembleAlpha \
            -Pthwiply.abi=arm64-v8a \
            -Pthwiply.versionCode="$VERSION_CODE" \
            -Pthwiply.versionName="$VERSION_NAME" \
            --stacktrace \
            --no-daemon

          source_apk="app/build/outputs/apk/alpha/app-alpha-unsigned.apk"
          if [[ ! -f "$source_apk" ]]; then
            echo "Expected arm64 alpha APK not found: $source_apk" >&2
            exit 1
          fi

          arm64_unsigned="$RUNNER_TEMP/thwiply-arm64-v8a-unsigned.apk"
          cp "$source_apk" "$arm64_unsigned"
          printf 'ARM64_UNSIGNED_PATH=%s\n' "$arm64_unsigned" >> "$GITHUB_ENV"

      - name: Build x86_64 emulator alpha
        run: |
          set -euo pipefail

          ./gradlew \
            clean \
            :app:assembleAlpha \
            -Pthwiply.abi=x86_64 \
            -Pthwiply.versionCode="$VERSION_CODE" \
            -Pthwiply.versionName="$VERSION_NAME" \
            --stacktrace \
            --no-daemon

          source_apk="app/build/outputs/apk/alpha/app-alpha-unsigned.apk"
          if [[ ! -f "$source_apk" ]]; then
            echo "Expected x86_64 alpha APK not found: $source_apk" >&2
            exit 1
          fi

          x86_unsigned="$RUNNER_TEMP/thwiply-x86_64-unsigned.apk"
          cp "$source_apk" "$x86_unsigned"
          printf 'X86_UNSIGNED_PATH=%s\n' "$x86_unsigned" >> "$GITHUB_ENV"

      - name: Sign and verify alpha APKs
        env:
          ALPHA_KEYSTORE_BASE64: ${{ secrets.ALPHA_KEYSTORE_BASE64 }}
          ALPHA_KEYSTORE_PASSWORD: ${{ secrets.ALPHA_KEYSTORE_PASSWORD }}
          ALPHA_KEY_ALIAS: ${{ secrets.ALPHA_KEY_ALIAS }}
          ALPHA_KEY_PASSWORD: ${{ secrets.ALPHA_KEY_PASSWORD }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          keystore_path="$RUNNER_TEMP/thwiply-alpha-signing.p12"
          trap 'rm -f "$keystore_path"' EXIT
          printf '%s' "$ALPHA_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"

          build_tools_version="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -exec basename {} \; |
              sort -V |
              tail -n 1
          )"
          apksigner="$ANDROID_HOME/build-tools/$build_tools_version/apksigner"
          if [[ ! -x "$apksigner" ]]; then
            echo "Android apksigner not found: $apksigner" >&2
            exit 1
          fi

          release_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$release_dir"
          arm64_signed="$release_dir/thwiply-${TAG_NAME}-arm64-v8a.apk"
          x86_signed="$release_dir/thwiply-${TAG_NAME}-x86_64-emulator.apk"

          for artifact in \
            "$ARM64_UNSIGNED_PATH:$arm64_signed" \
            "$X86_UNSIGNED_PATH:$x86_signed"
          do
            unsigned_path="${artifact%%:*}"
            signed_path="${artifact#*:}"
            "$apksigner" sign \
              --ks "$keystore_path" \
              --ks-type PKCS12 \
              --ks-key-alias "$ALPHA_KEY_ALIAS" \
              --ks-pass env:ALPHA_KEYSTORE_PASSWORD \
              --key-pass env:ALPHA_KEY_PASSWORD \
              --out "$signed_path" \
              "$unsigned_path"
            "$apksigner" verify --verbose --print-certs "$signed_path"
          done

          bash scripts/check-apk-size.sh "$arm64_signed" "$MAX_ARM64_APK_BYTES"

          checksum_path="$release_dir/SHA256SUMS"
          (
            cd "$release_dir"
            sha256sum \
              "$(basename "$arm64_signed")" \
              "$(basename "$x86_signed")" \
              > "$(basename "$checksum_path")"
          )

          printf 'ARM64_SIGNED_PATH=%s\n' "$arm64_signed" >> "$GITHUB_ENV"
          printf 'X86_SIGNED_PATH=%s\n' "$x86_signed" >> "$GITHUB_ENV"
          printf 'CHECKSUM_PATH=%s\n' "$checksum_path" >> "$GITHUB_ENV"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/release-notes.md"
          cat > "$notes_file" <<EOF
          > [!WARNING]
          > This is an early alpha. If you are upgrading from v1.0.0-alpha.3 or earlier,
          > uninstall the old app once because those builds used ephemeral debug signing.
          > Uninstalling removes local app data. Persistently signed alphas after that
          > transition can update in place when their Android version code increases.

          Use the **arm64-v8a** APK on physical Android devices and the **x86_64**
          APK on x86_64 emulators. Model weights are downloaded and verified after
          installation; they are not bundled in either APK. Verify downloads with
          the attached \`SHA256SUMS\` file.
          EOF

          gh release create "$TAG_NAME" \
            "$ARM64_SIGNED_PATH#Thwiply ${TAG_NAME} arm64-v8a APK" \
            "$X86_SIGNED_PATH#Thwiply ${TAG_NAME} x86_64 emulator APK" \
            "$CHECKSUM_PATH#SHA-256 checksums" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Thwiply ${TAG_NAME}" \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --notes-file "$notes_file"
